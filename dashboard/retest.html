<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Retests</title>
  <!-- Retired 2026-08-22, replaced by the error-code table on the customize
       page: per error rather than per unit, and carrying the root cause and
       corrective action beside each one. Kept as a redirect because the
       address was handed out. -->
  <meta http-equiv="refresh" content="0; url=customize.html#section=errors">
  <link rel="canonical" href="customize.html">
  <script>
    /* A meta refresh drops the #fragment. Nothing the old page took in one
       maps onto the new section, so a fragment that arrives is preserved and
       the errors section is the default landing. */
    (function () {
      var target = 'customize.html';
      location.replace(location.hash ? target + location.hash
                                     : target + '#section=errors');
    })();
  </script>
</head>
<body>
  <p>The retest page has been replaced by the error-code table.
     <a href="customize.html#section=errors">Go to Customize</a>.</p>
</body>
</html>
