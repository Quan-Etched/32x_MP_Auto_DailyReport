<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>End-to-end test flow</title>
  <!-- Folded into flow.html 2026-08-22, which now hosts both drawings behind a
       switch. A chart on its own page, reached by one link in a row of eleven,
       is a chart nobody reads. Kept as a redirect because the address was
       handed out. -->
  <meta http-equiv="refresh" content="0; url=flow.html#chart=e2e">
  <link rel="canonical" href="flow.html">
  <script>
    /* Nothing this page took maps onto a fragment there, but an address that
       arrives with one keeps it — the rule that stops a handed-out
       page.html#thing losing #thing. Otherwise: straight to the drawing. */
    (function () {
      location.replace('flow.html' + (location.hash || '#chart=e2e'));
    })();
  </script>
</head>
<body>
  <p>The end-to-end flow is on the flow page now.
     <a href="flow.html#chart=e2e">Go there</a>.</p>
</body>
</html>
