<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>First-Pass Yield by Test Step</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="fpy.css">
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <h1>First-Pass Yield by Test Step</h1>
    <span class="meta" id="meta"></span>
    <span class="build" id="build"></span>
    <span class="spacer"></span>
    <a class="theme-toggle" href="flow.html">Test flow &rarr;</a>
    <a class="theme-toggle" href="index.html">&larr; Station yield</a>
    <button type="button" class="theme-toggle" id="theme-toggle">Theme: system</button>
  </header>

  <section class="fpy-headline" id="headline"></section>

  <div class="table-wrap">
    <table class="fpy-table">
      <caption id="caption"></caption>
      <thead>
        <tr>
          <th scope="col">Test step</th>
          <th scope="col" class="n">Units</th>
          <th scope="col" class="n">Runs</th>
          <th scope="col" class="n">First-pass yield</th>
          <th scope="col" class="n">After retest</th>
          <th scope="col" class="n">Retest load</th>
          <th scope="col">Top failures this week</th>
        </tr>
      </thead>
      <tbody id="body"></tbody>
    </table>
  </div>

  <section class="fpy-readiness" id="readiness"></section>

  <footer class="notes" id="sources"></footer>

</div>

<script src="data/fpy.js"></script>
<script src="fpy.js"></script>
<script src="theme.js"></script>
<script src="update.js"></script>
</body>
</html>
