<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>First-Pass Yield</title>
  <!-- Superseded by the weekly tracker, which runs Monday to Sunday rather
       than on a rolling seven days. Kept as a redirect because the address
       was handed out. -->
  <meta http-equiv="refresh" content="0; url=week.html">
  <link rel="canonical" href="week.html">
  <script>
    /* A meta refresh drops the #fragment, and these addresses were handed out
       with one — index.html#station=l10_2u and the like. Carry it across. */
    (function () {
      var target = 'week.html';
      if (location.hash) { location.replace(target + location.hash); }
    })();
  </script>
</head>
<body>
  <p>This page is now <a href="week.html">the weekly tracker</a>.</p>
</body>
</html>
