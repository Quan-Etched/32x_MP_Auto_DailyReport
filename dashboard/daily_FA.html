<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daily FA — L10 FAT / SFT / RIN</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="stations.css">
  <link rel="stylesheet" href="dailyfa.css?v=preview2">
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <h1>Daily FA</h1>
    <span class="meta" id="meta"></span>
    <span class="build" id="build" title="Which build of the analysis produced this page"></span>
    <span class="spacer"></span>
    <nav class="masthead-nav" id="nav"></nav>
    <button type="button" class="theme-toggle" id="theme-toggle">Theme: system</button>
  </header>

  <nav class="daycal" id="daycal" aria-label="Day"></nav>

  <div class="banner" id="notice" hidden></div>

  <main id="content">
    <section class="fa-report" id="fat-report" hidden>
      <h2>L10 FAT <span class="l10-sub" id="fat-report-day"></span>
        <span class="fa-yield" id="fat-report-counts"></span></h2>
      <p class="fa-sns" id="fat-report-sns"></p>
      <div class="fa-table-wrap" id="fat-report-table"></div>
      <p class="fa-actions">
        <a id="fat-report-csv" href="#">Download CSV</a>
        <span id="fat-report-note"></span>
      </p>
    </section>

    <section class="fa-report" id="sft-report" hidden>
      <h2>L10 SFT <span class="l10-sub" id="sft-report-day"></span>
        <span class="fa-yield" id="sft-report-counts"></span></h2>
      <p class="fa-sns" id="sft-report-sns"></p>
      <div class="fa-table-wrap" id="sft-report-table"></div>
      <p class="fa-actions">
        <a id="sft-report-csv" href="#">Download CSV</a>
        <span id="sft-report-note"></span>
      </p>
    </section>

    <section class="fa-report" id="rin-report" hidden>
      <h2>L10 RIN <span class="l10-sub" id="rin-report-day"></span>
        <span class="fa-yield" id="rin-report-counts"></span></h2>
      <p class="fa-sns" id="rin-report-sns"></p>
      <div class="fa-table-wrap" id="rin-report-table"></div>
      <p class="fa-actions">
        <a id="rin-report-csv" href="#">Download CSV</a>
        <span id="rin-report-note"></span>
      </p>
    </section>
  </main>

  <footer class="notes">
    <p>
      This page is the L10 FAT / SFT / RIN failure report. Pick a day, then
      download the CSV or file a Jira from a row. The daily tracker tables
      stay on
      <a href="dailyexcel.html">Daily tracker</a>.
    </p>
  </footer>

</div>

<script src="data/dailyfa.js"></script>
<script src="failreport.js?v=preview2"></script>
<script src="dailyfa.js"></script>
<script src="nav.js"></script>
<script src="theme.js"></script>
</body>
</html>
